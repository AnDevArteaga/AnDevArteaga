<svg xmlns="http://www.w3.org/2000/svg" width="960" height="504" viewBox="0 0 960 504" role="img" aria-labelledby="title desc">
  <title id="title">Proyectos públicos de Andrés Arteaga</title>
  <desc id="desc">Procesamiento masivo de datos, concurrencia de pagos, operaciones e inteligencia artificial aplicada a la traducción de lenguas nativas de Colombia.</desc>
  <defs>
