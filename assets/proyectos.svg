    <g id="card">
      <rect x=".5" y=".5" width="469" height="241" rx="21" fill="url(#panel)" stroke="currentColor" stroke-opacity=".38"/>
      <rect x="23" y="21" width="424" height="112" rx="12" fill="#0e1728"/>
      <rect x="23" y="21" width="424" height="112" rx="12" fill="url(#grid)"/>
    </g>
